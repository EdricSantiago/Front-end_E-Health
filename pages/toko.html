<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Kesehatan - HeiDoc</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <h1 class="page-title">Toko Kesehatan</h1>

    <div class="product-list">
        <div class="product-card">
            <div class="product-image">Gambar Produk</div>
            <div class="product-info">
                <p class="product-name">Paracetamol 500mg</p>
                <p class="product-subtitle">Strip</p>
                <div class="product-price-row">
                    <span class="product-price">Rp12.000</span>
                    <span class="product-discount">10%</span>
                </div>
                <span class="product-old-price">Rp13.500</span>
                <button type="button" class="btn-add">Tambah +</button>
            </div>
        </div>

        <div class="product-card">
            <div class="product-image">Gambar Produk</div>
            <div class="product-info">
                <p class="product-name">Vitamin C 1000mg</p>
                <p class="product-subtitle">Botol</p>
                <div class="product-price-row">
                    <span class="product-price">Rp45.000</span>
                    <span class="product-discount">15%</span>
                </div>
                <span class="product-old-price">Rp53.000</span>
                <button type="button" class="btn-add">Tambah +</button>
            </div>
        </div>

        <div class="product-card">
            <div class="product-image">Gambar Produk</div>
            <div class="product-info">
                <p class="product-name">Obat Batuk Cair</p>
                <p class="product-subtitle">Botol</p>
                <div class="product-price-row">
                    <span class="product-price">Rp28.500</span>
                </div>
                <button type="button" class="btn-add">Tambah +</button>
            </div>
        </div>

        <div class="product-card">
            <div class="product-image">Gambar Produk</div>
            <div class="product-info">
                <p class="product-name">Vitamin D3 1000 IU</p>
                <p class="product-subtitle">Botol</p>
                <div class="product-price-row">
                    <span class="product-price">Rp39.000</span>
                    <span class="product-discount">20%</span>
                </div>
                <span class="product-old-price">Rp48.700</span>
                <button type="button" class="btn-add">Tambah +</button>
            </div>
        </div>
    </div>
</body>
</html>
