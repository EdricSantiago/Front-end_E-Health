<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator BMI - HeiDoc</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="../js/auth.js"></script>
</head>
<body>
    <div class="bmi-container">
        <div class="bmi-header">
            <a href="javascript:void(0)" onclick="goBack()" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="bmi-header-title">Kalkulator BMI</h1>
        </div>

        <div class="bmi-banner">
            <div class="menu-icon">
                <i class="fa-solid fa-calculator"></i>
            </div>
            <div>
                <p class="bmi-banner-text">Body Mass Index (BMI) adalah cara menghitung berat badan ideal berdasarkan tinggi dan berat badan.</p>
                <a href="bmi_faq.html" class="bmi-banner-link">SELENGKAPNYA</a>
            </div>
        </div>

        <div class="gender-selector">
            <div class="gender-option active" id="opt-male">
                <div class="gender-avatar">
                    <i class="fa-sharp fa-solid fa-person"></i>
                </div>
                <span class="gender-label">Laki-laki</span>
            </div>
            <div class="gender-option" id="opt-female">
                <div class="gender-avatar">
                    <i class="fa-solid fa-person-dress"></i>
                </div>
                <span class="gender-label">Perempuan</span>
            </div>
        </div>

        <div class="bmi-form-group">
            <label for="height">Tinggi (cm)*</label>
            <input type="number" id="height" class="bmi-input-line" placeholder="Masukkan tinggi badan">
        </div>

        <div class="bmi-form-group">
            <label for="weight">Berat (kg)*</label>
            <input type="number" id="weight" class="bmi-input-line" placeholder="Masukkan berat badan">
        </div>

        <div class="bmi-result-box" id="result-box">
            <div class="bmi-result-value" id="result-value">0.0</div>
            <div class="bmi-result-status" id="result-status">Kategori</div>
        </div>

        <button type="button" class="btn-hitung" id="btn-calculate" disabled>HITUNG BMI</button>
    </div>

    <script src="../js/bmi.js"></script>
    <script src="../js/riwayat-helper.js"></script>
</body>
</html>
