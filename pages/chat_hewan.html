<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Dokter Hewan - HeiDoc</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>

    <main class="animal-chat">

        <h1 id="doctorName"></h1>
        <p>Dokter Hewan</p>

        <div id="chatBox" class="animal-chat-box">
            <div class="doctor-message">
                Halo, ada yang bisa saya bantu mengenai hewan kesayanganmu?
            </div>
        </div>

        <form id="chatForm" class="animal-chat-form">

            <input
                type="text"
                id="messageInput"
                placeholder="Tulis pesan..."
            >

            <button type="submit">
                Kirim
            </button>

        </form>

    </main>

    <script src="../js/chat_hewan.js"></script>

</body>
</html>
