<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Dokter - HaloDoc</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <script src="../js/auth.js"></script>
</head>

<body>
    <script src="../js/components/top_nav.js"></script>
    <main class="dd-wrapper">
        <a href="daftar_dokter.html" class="dd-kembali">← Kembali ke Daftar Dokter</a>

        <section class="dd-card" id="dd-card">
            <div class="dd-foto">Foto Dokter</div>

            <div class="dd-info">
                <h1 id="dd-nama"></h1>
                <p id="dd-spesialis"></p>
                <p class="dd-rating" id="dd-rating"></p>

                <div class="dd-tombol">
                    <button type="button" id="btn-chat">Konsultasi</button>
                    <button type="button" class="dd-outline" id="btn-jadwal">Lihat Jadwal</button>
                </div>
            </div>
        </section>

        <section class="dd-box" id="dd-detail">
            <h2>Tentang Dokter</h2>
            <p id="dd-tentang"></p>

            <h2>Informasi</h2>
            <ul>
                <li>Pengalaman : <span id="dd-pengalaman"></span></li>
                <li>Biaya konsultasi : <span id="dd-biaya"></span></li>
            </ul>
        </section>

        <p class="dd-tidak-ada" id="dd-tidak-ada">Data dokter tidak ditemukan.</p>
    </main>

    <script src="../js/data/dokter.js"></script>
    <script src="../js/detail_dokter.js"></script>
</body>
</html>
