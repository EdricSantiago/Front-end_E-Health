<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Ahli Gizi - HeiDoc</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="../js/auth.js"></script>
</head>
<body>

    <main class="diet-chat">

        <h1 id="doctorName"></h1>
        <p>Ahli Gizi</p>

        <div id="chatBox" class="diet-chat-box">

            <div class="doctor-message">
                Halo, ada yang bisa saya bantu mengenai
                pola makan dan kebutuhan nutrisi?
            </div>

        </div>

        <form id="chatForm" class="diet-chat-form">

            <input
                type="text"
                id="messageInput"
                placeholder="Tulis pesan..."
            >

            <button type="submit">
                Kirim
            </button>

        </form>

    </main>

    <script src="../js/chat_gizi.js"></script>

</body>
</html>
